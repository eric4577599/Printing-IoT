services:
  # Frontend Application (Vite/React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5600:80" # Map container port 80 to host port 5600 (as per user preference in docs)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:5200
    restart: always
    depends_on:
      - backend-api

  # Backend Web API (.NET 8)
  backend-api:
    build:
      context: ./backend
      dockerfile: PrintingIoT.API/Dockerfile
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=FlexoDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password}
      - Redis__ConnectionString=redis:6379
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET is required}
    restart: always
    depends_on:
      - postgres
      - redis

  # Backend Worker Service (MQTT & Background Tasks)
  backend-worker:
    build:
      context: ./backend
      dockerfile: PrintingIoT.Worker/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=FlexoDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password}
      - Mqtt__BrokerAddress=mqtt-broker
      - Mqtt__Port=1883
      - Redis__ConnectionString=redis:6379
    restart: always
    depends_on:
      - mqtt-broker
      - postgres
      - redis

  # Database (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-FlexoDB}
      # Phase 3.9: SmartPartsDB and MmsDB removed — all tables now in FlexoDB
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cache (Redis)
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"

  # IoT Message Broker (Mosquitto)
  mqtt-broker:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "1884:1883"
      - "9001:9001" # WebSocket port
    volumes:
      - ./backend/mosquitto/config:/mosquitto/config
      - ./backend/mosquitto/data:/mosquitto/data
      - ./backend/mosquitto/log:/mosquitto/log

  # Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend-api

  # Maintenance Management System — Standalone MMS API (.NET 9)
  # 對應 cloudflared 的 mms-api.ericchh.work -> mms-backend:5300
  # 採獨立資料庫 MmsDB(同台 postgres),維持「真分離」。無 EF migration,靠 EnsureCreated 建 schema。
  mms-backend:
    build:
      context: ./Maintenance-System
      dockerfile: backend/MMS.API/Dockerfile
    ports:
      - "5300:5300"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5300
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=MmsDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password}
    restart: always
    depends_on:
      - postgres

  # Smart Parts Frontend (now uses unified backend-api at /api/v1/parts)
  sm-frontend:
    build:
      context: ./smart-parts-frontend
      dockerfile: Dockerfile
    ports:
      - "5100:80"
    depends_on:
      - backend-api  # Phase 3.9: Changed from sm-backend → backend-api

  # ======================================================================
  # DEPRECATED: The following services have been merged into backend-api
  # sm-backend  → PrintingIoT.API/Controllers/PartsController (Phase 3.3)
  # mms-backend → PrintingIoT.API/Controllers/MaintenanceController (existing)
  # SmartPartsDB → FlexoDB (Parts/Suppliers/SupplierParts tables)
  # MmsDB → FlexoDB (MaintenanceSchedules/SpareParts/MaintenanceRecords tables)
  # ======================================================================

volumes:
  postgres_data:

