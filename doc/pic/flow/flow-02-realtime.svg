<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif" role="img" aria-label="即時監控資料流(設備訊號 → 看板畫面)"><title>即時監控資料流(設備訊號 → 看板畫面)</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#455a64"/></marker></defs><rect width="1000" height="560" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#1a237e">即時監控資料流(設備訊號 → 看板畫面)</text><rect x="30" y="70" width="220" height="110" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="140.0" y="101.5" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">① 設備發布</text><text x="140.0" y="120.5" text-anchor="middle" font-size="14" fill="#7a2e00">WISE 把 DI 計數、狀態</text><text x="140.0" y="139.5" text-anchor="middle" font-size="14" fill="#7a2e00">發布到 Advantech/+/data</text><text x="140.0" y="158.5" text-anchor="middle" font-size="14" fill="#7a2e00">(模擬器:factory/machine/update)</text>
<rect x="270" y="70" width="220" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="380.0" y="101.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">② Worker 解析</text><text x="380.0" y="120.5" text-anchor="middle" font-size="14" fill="#0d3c75">依「通訊設定」的計數訊號</text><text x="380.0" y="139.5" text-anchor="middle" font-size="14" fill="#0d3c75">與馬達訊號轉成</text><text x="380.0" y="158.5" text-anchor="middle" font-size="14" fill="#0d3c75">MachineSample</text>
<rect x="510" y="70" width="220" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="620.0" y="101.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">③ 統一管線</text><text x="620.0" y="120.5" text-anchor="middle" font-size="14" fill="#0d3c75">搶設備鎖 → 算車速</text><text x="620.0" y="139.5" text-anchor="middle" font-size="14" fill="#0d3c75">(或採設備帶的車速)</text><text x="620.0" y="158.5" text-anchor="middle" font-size="14" fill="#0d3c75">→ 組成 MonitorData</text>
<rect x="750" y="70" width="220" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="860.0" y="101.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">④ 寫 Redis 快照</text><text x="860.0" y="120.5" text-anchor="middle" font-size="14" fill="#1b4d1f">SET factory/monitor</text><text x="860.0" y="139.5" text-anchor="middle" font-size="14" fill="#1b4d1f">(camelCase JSON)</text><text x="860.0" y="158.5" text-anchor="middle" font-size="14" fill="#1b4d1f">每筆都覆寫</text>
<path d="M 250,125 L 270,125" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 490,125 L 510,125" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 730,125 L 750,125" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="510" y="250" width="220" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="620.0" y="281.0" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">⑤ 節流寫歷史</text><text x="620.0" y="300.0" text-anchor="middle" font-size="14" fill="#1b4d1f">ProductionLogs:該設備首筆、</text><text x="620.0" y="319.0" text-anchor="middle" font-size="14" fill="#1b4d1f">狀態改變、或達寫入間隔</text>
<rect x="750" y="250" width="220" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="860.0" y="281.0" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">⑥ 廣播 MQTT</text><text x="860.0" y="300.0" text-anchor="middle" font-size="14" fill="#7a2e00">factory/monitor/update</text><text x="860.0" y="319.0" text-anchor="middle" font-size="14" fill="#7a2e00">(供訂閱的畫面使用)</text>
<path d="M 620,180 L 620,250" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 860,180 L 860,250" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="400" width="220" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="140.0" y="431.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">⑦ 前端輪詢</text><text x="140.0" y="450.5" text-anchor="middle" font-size="14" fill="#0d3c75">每 1 秒 GET</text><text x="140.0" y="469.5" text-anchor="middle" font-size="14" fill="#0d3c75">/api/monitor/realtime</text><text x="140.0" y="488.5" text-anchor="middle" font-size="14" fill="#0d3c75">(useRealtimeData)</text>
<rect x="290" y="400" width="220" height="110" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="400.0" y="431.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">⑧ API 讀快照</text><text x="400.0" y="450.5" text-anchor="middle" font-size="14" fill="#0d3c75">讀 Redis factory/monitor</text><text x="400.0" y="469.5" text-anchor="middle" font-size="14" fill="#0d3c75">以不分大小寫反序列化</text><text x="400.0" y="488.5" text-anchor="middle" font-size="14" fill="#0d3c75">無快照 → 204</text>
<rect x="550" y="400" width="200" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="650.0" y="431.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">⑨ 看板顯示</text><text x="650.0" y="450.5" text-anchor="middle" font-size="14" fill="#1b4d1f">數量 = 計數 − 歸零偏移</text><text x="650.0" y="469.5" text-anchor="middle" font-size="14" fill="#1b4d1f">車速、狀態燈、</text><text x="650.0" y="488.5" text-anchor="middle" font-size="14" fill="#1b4d1f">本日/本筆彙總</text>
<path d="M 250,455 L 290,455" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 510,455 L 550,455" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 860,180 L 860,215 L 400,215 L 400,400" fill="none" stroke="#455a64" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="608.5" y="197.0" width="43" height="17" fill="#ffffff" opacity="0.9"/>
<text x="630.0" y="209.0" text-anchor="middle" font-size="12" fill="#455a64">Redis</text>
<text x="780" y="407.0" text-anchor="start" font-size="12" fill="#37474f" font-weight="700">設計重點</text><text x="780" y="426.0" text-anchor="start" font-size="12" fill="#37474f">• 看板只信「後端算的」</text><text x="780" y="445.0" text-anchor="start" font-size="12" fill="#37474f">• 歸零(Tare)只在前端:</text><text x="780" y="464.0" text-anchor="start" font-size="12" fill="#37474f">  F3 送單時記下目前計數,</text><text x="780" y="483.0" text-anchor="start" font-size="12" fill="#37474f">  顯示數量從 0 起算</text>
<text x="30" y="545.0" text-anchor="start" font-size="12" fill="#546e7a">通訊設定頁(plc_count_signal / plc_motor_signal / 定時寫入間隔)由 Worker 週期重讀,改了不必重啟。</text></svg>