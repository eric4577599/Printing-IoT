<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif" role="img" aria-label="作業員生產流程與 F 鍵"><title>作業員生產流程與 F 鍵</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#455a64"/></marker></defs><rect width="1000" height="600" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#1a237e">作業員生產流程與 F 鍵</text><rect x="30" y="60" width="190" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="125.0" y="85.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">登入</text><text x="125.0" y="104.5" text-anchor="middle" font-size="14" fill="#0d3c75">點名冊一列 → 選取</text>
<rect x="270" y="60" width="190" height="60" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/>
<text x="365.0" y="85.5" text-anchor="middle" font-size="14" fill="#263238" font-weight="700">看板待機(Idle)</text><text x="365.0" y="104.5" text-anchor="middle" font-size="14" fill="#263238">綠框空白、等待 F3</text>
<rect x="510" y="60" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="610.0" y="85.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">選一筆排隊中的訂單</text><text x="610.0" y="104.5" text-anchor="middle" font-size="14" fill="#0d3c75">(F1 上移 / F2 下移)</text>
<path d="M 220,90 L 270,90" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 460,90 L 510,90" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="860,45.0 960.0,90 860,135.0 760.0,90" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="860" y="86.5" text-anchor="middle" font-size="13" fill="#7a2e00">F3 送單</text><text x="860" y="103.5" text-anchor="middle" font-size="13" fill="#7a2e00">PLC 已連線 ?</text>
<path d="M 710,90 L 760,90" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="760" y="190" width="220" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
<text x="870.0" y="215.5" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">提示「PLC 未連線」</text><text x="870.0" y="234.5" text-anchor="middle" font-size="14" fill="#7f1d1d">不開始生產</text>
<path d="M 860,135 L 860,190" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="849.0" y="147.5" width="22" height="17" fill="#ffffff" opacity="0.9"/>
<text x="860.0" y="159.5" text-anchor="middle" font-size="12" fill="#455a64">否</text>
<rect x="510" y="190" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="610.0" y="211.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">訂單進綠框</text><text x="610.0" y="230.5" text-anchor="middle" font-size="14" fill="#1b4d1f">計數歸零(記下目前計數)</text><text x="610.0" y="249.5" text-anchor="middle" font-size="14" fill="#1b4d1f">本筆運轉/停車時間歸零</text><text x="610.0" y="268.5" text-anchor="middle" font-size="14" fill="#1b4d1f">同步後端 CurrentOrder</text>
<path d="M 760,90 L 700,90 L 700,170 L 640,170 L 640,190" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="713.0" y="72.0" width="22" height="17" fill="#ffffff" opacity="0.9"/>
<text x="724.0" y="84.0" text-anchor="middle" font-size="12" fill="#455a64">是</text>
<rect x="270" y="190" width="190" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="365.0" y="211.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">生產中</text><text x="365.0" y="230.5" text-anchor="middle" font-size="14" fill="#1b4d1f">數量、車速即時更新</text><text x="365.0" y="249.5" text-anchor="middle" font-size="14" fill="#1b4d1f">車速 0 且剩餘 &gt; 50 張時</text><text x="365.0" y="268.5" text-anchor="middle" font-size="14" fill="#1b4d1f">自動跳出停車原因視窗</text>
<path d="M 510,235 L 460,235" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="365,315.0 460.0,360 365,405.0 270.0,360" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="365" y="365.0" text-anchor="middle" font-size="13" fill="#7a2e00">要結束這筆 ?</text>
<path d="M 365,280 L 365,315" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="320" width="190" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="125.0" y="351.0" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">F10 退回(車速須為 0)</text><text x="125.0" y="370.0" text-anchor="middle" font-size="14" fill="#7a2e00">Auto Next ON:與下一筆交換</text><text x="125.0" y="389.0" text-anchor="middle" font-size="14" fill="#7a2e00">OFF:綠框留空、回待機</text>
<path d="M 270,360 L 220,360" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="227.0" y="345.0" width="36" height="17" fill="#ffffff" opacity="0.9"/>
<text x="245.0" y="357.0" text-anchor="middle" font-size="12" fill="#455a64">退回</text>
<rect x="510" y="330" width="200" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="610.0" y="355.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">F4 完工</text><text x="610.0" y="374.5" text-anchor="middle" font-size="14" fill="#0d3c75">車速須為 0、數量 &gt; 0</text>
<path d="M 460,360 L 510,360" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="467.0" y="345.0" width="36" height="17" fill="#ffffff" opacity="0.9"/>
<text x="485.0" y="357.0" text-anchor="middle" font-size="12" fill="#455a64">完工</text>
<rect x="510" y="430" width="200" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="610.0" y="460.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">完工視窗 → 送後端落地</text><text x="610.0" y="479.5" text-anchor="middle" font-size="14" fill="#0d3c75">(詳見圖 3)</text>
<path d="M 610,390 L 610,430" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="760" y="430" width="220" height="70" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/>
<text x="870.0" y="451.0" text-anchor="middle" font-size="14" fill="#263238" font-weight="700">完工後:該筆移出佇列</text><text x="870.0" y="470.0" text-anchor="middle" font-size="14" fill="#263238">下一筆直接遞補為目前工單</text><text x="870.0" y="489.0" text-anchor="middle" font-size="14" fill="#263238">佇列空了就回到待機,可再 F3</text>
<path d="M 710,465 L 760,465" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="30" y="450" width="460" height="120" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/>
<text x="260.0" y="467.5" text-anchor="middle" font-size="14" fill="#263238" font-weight="700">其他 F 鍵</text><text x="260.0" y="486.5" text-anchor="middle" font-size="14" fill="#263238">F7 訂單詳情(紙箱規格、機台軸位置)</text><text x="260.0" y="505.5" text-anchor="middle" font-size="14" fill="#263238">F5 計數 +1 / F6 計數 −1(手動修正數量)</text><text x="260.0" y="524.5" text-anchor="middle" font-size="14" fill="#263238">F8 切換 Auto Next(畫面標示 M/N 下一筆)</text><text x="260.0" y="543.5" text-anchor="middle" font-size="14" fill="#263238">F9 換班別(開啟登入視窗)</text><text x="260.0" y="562.5" text-anchor="middle" font-size="14" fill="#263238">F12 離開系統(會跳出瀏覽器確認視窗)</text>
<text x="520" y="565.0" text-anchor="start" font-size="12" fill="#546e7a">F 鍵作用於看板頁(即時監控);其他頁面不響應。</text></svg>