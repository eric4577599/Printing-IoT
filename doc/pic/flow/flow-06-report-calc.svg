<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif" role="img" aria-label="報表數字從哪裡來、怎麼算"><title>報表數字從哪裡來、怎麼算</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#455a64"/></marker></defs><rect width="1000" height="480" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#1a237e">報表數字從哪裡來、怎麼算</text><rect x="30" y="60" width="230" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="145.0" y="91.0" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">完工實績</text><text x="145.0" y="110.0" text-anchor="middle" font-size="14" fill="#1b4d1f">ProductionCompletions</text><text x="145.0" y="129.0" text-anchor="middle" font-size="14" fill="#1b4d1f">(每筆完工一列,含不良/停機明細)</text>
<rect x="330" y="40" width="210" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="435.0" y="65.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">GET /production/completions</text><text x="435.0" y="84.5" text-anchor="middle" font-size="14" fill="#0d3c75">生產明細</text>
<rect x="330" y="120" width="210" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="435.0" y="145.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">GET /summary/daily</text><text x="435.0" y="164.5" text-anchor="middle" font-size="14" fill="#0d3c75">日報彙總</text>
<rect x="330" y="200" width="210" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="435.0" y="225.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">GET /summary/monthly</text><text x="435.0" y="244.5" text-anchor="middle" font-size="14" fill="#0d3c75">月報(每日一列 + 總計)</text>
<rect x="330" y="280" width="210" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="435.0" y="305.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">GET /summary/stop-reasons</text><text x="435.0" y="324.5" text-anchor="middle" font-size="14" fill="#0d3c75">停車原因(依次數遞減)</text>
<path d="M 260,105 L 300,105 L 300,70 L 330,70" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 260,105 L 300,105 L 300,150 L 330,150" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 260,105 L 300,105 L 300,230 L 330,230" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 260,105 L 300,105 L 300,310 L 330,310" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="620" y="40" width="350" height="300" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="795.0" y="100.0" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">計算口徑(後端權威,OeeCalculator)</text><text x="795.0" y="119.0" text-anchor="middle" font-size="14" fill="#7a2e00">負荷時間 L = 運轉 + 停機 − 準備</text><text x="795.0" y="138.0" text-anchor="middle" font-size="14" fill="#7a2e00">稼動率 A = min(運轉, L) ÷ L</text><text x="795.0" y="157.0" text-anchor="middle" font-size="14" fill="#7a2e00">效能 P = min(良品 ÷ 目標, 1)(超產封頂)</text><text x="795.0" y="176.0" text-anchor="middle" font-size="14" fill="#7a2e00">良率 Q = 良品 ÷ (良品 + 不良)</text><text x="795.0" y="195.0" text-anchor="middle" font-size="14" fill="#7a2e00">OEE = A × P × Q(三因子先四捨五入到 0.1)</text><text x="795.0" y="214.0" text-anchor="middle" font-size="14" fill="#7a2e00"></text><text x="795.0" y="233.0" text-anchor="middle" font-size="14" fill="#7a2e00">停機時間含準備時間(準備算在停機內)</text><text x="795.0" y="252.0" text-anchor="middle" font-size="14" fill="#7a2e00">日報稼動率與月報同口徑(2026-11-15 統一)</text><text x="795.0" y="271.0" text-anchor="middle" font-size="14" fill="#7a2e00">日報平均 OEE:逐筆 OEE 依產量加權</text><text x="795.0" y="290.0" text-anchor="middle" font-size="14" fill="#7a2e00">月報 OEE:用當日/整月合計重算</text>
<path d="M 540,150 L 620,150" fill="none" stroke="#455a64" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<path d="M 540,230 L 620,230" fill="none" stroke="#455a64" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="30" y="400" width="440" height="110" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.6"/>
<text x="250.0" y="431.5" text-anchor="middle" font-size="14" fill="#3f0f5c" font-weight="700">工廠日(報表的「日期」)</text><text x="250.0" y="450.5" text-anchor="middle" font-size="14" fill="#3f0f5c">完工時間換算成工廠時區(Asia/Taipei)後,</text><text x="250.0" y="469.5" text-anchor="middle" font-size="14" fill="#3f0f5c">減去日界時數 8 小時再取日期。</text><text x="250.0" y="488.5" text-anchor="middle" font-size="14" fill="#3f0f5c">例:夜班 10/10 22:00 與 10/11 02:00 完工,都屬 10/10。</text>
<rect x="520" y="400" width="450" height="110" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/>
<text x="745.0" y="431.5" text-anchor="middle" font-size="14" fill="#263238" font-weight="700">報表頁的資料來源提示</text><text x="745.0" y="450.5" text-anchor="middle" font-size="14" fill="#263238">「彙總數字由後端計算」:正常路徑</text><text x="745.0" y="469.5" text-anchor="middle" font-size="14" fill="#263238">「改以本機計算」:有未同步的本機紀錄,或後端無法連線</text><text x="745.0" y="488.5" text-anchor="middle" font-size="14" fill="#263238">(此時數字可能與後端不一致)</text>
<text x="30" y="435.5" text-anchor="start" font-size="12" fill="#546e7a">停車原因彙總來自完工時填的停機明細(代碼 + 原因快照)。</text><text x="30" y="454.5" text-anchor="start" font-size="12" fill="#546e7a">原因主檔改名或停用,歷史報表仍顯示當時的說法。</text></svg>