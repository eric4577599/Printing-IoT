<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif" role="img" aria-label="登入、角色與權杖"><title>登入、角色與權杖</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#455a64"/></marker></defs><rect width="1000" height="560" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#1a237e">登入、角色與權杖</text><rect x="30" y="60" width="200" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="130.0" y="90.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">開啟系統</text><text x="130.0" y="109.5" text-anchor="middle" font-size="14" fill="#0d3c75">顯示登入視窗(班別 + 名冊)</text>
<polygon points="330,60.0 405.0,95 330,130.0 255.0,95" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="330" y="100.0" text-anchor="middle" font-size="13" fill="#7a2e00">角色 ?</text>
<path d="M 230,95 L 255,95" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="450" y="40" width="250" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="575.0" y="56.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">作業員 OPERATOR</text><text x="575.0" y="75.5" text-anchor="middle" font-size="14" fill="#1b4d1f">點名冊一列(或輸入帳號)</text><text x="575.0" y="94.5" text-anchor="middle" font-size="14" fill="#1b4d1f">按「選取」,免打密碼</text><text x="575.0" y="113.5" text-anchor="middle" font-size="14" fill="#1b4d1f">(前端帶約定值 0000)</text>
<path d="M 405,80 L 450,80" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="402.5" y="65.0" width="50" height="17" fill="#ffffff" opacity="0.9"/>
<text x="427.5" y="77.0" text-anchor="middle" font-size="12" fill="#455a64">作業員</text>
<rect x="450" y="150" width="250" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="575.0" y="176.0" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">管理者 / 工程師 / 主管</text><text x="575.0" y="195.0" text-anchor="middle" font-size="14" fill="#7a2e00">先按「管理者」,</text><text x="575.0" y="214.0" text-anchor="middle" font-size="14" fill="#7a2e00">再輸入 12 碼英數密碼</text>
<path d="M 405,110 L 430,110 L 430,190 L 450,190" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="385.5" y="95.0" width="64" height="17" fill="#ffffff" opacity="0.9"/>
<text x="417.5" y="107.0" text-anchor="middle" font-size="12" fill="#455a64">其他角色</text>
<rect x="760" y="95" width="210" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="865.0" y="121.0" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">POST /api/v1/auth/login</text><text x="865.0" y="140.0" text-anchor="middle" font-size="14" fill="#0d3c75">後端驗證帳號與密碼</text><text x="865.0" y="159.0" text-anchor="middle" font-size="14" fill="#0d3c75">依角色套密碼政策</text>
<path d="M 700,80 L 730,80 L 730,120 L 760,120" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 700,190 L 730,190 L 730,150 L 760,150" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="760" y="230" width="210" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="865.0" y="261.0" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">簽發權杖</text><text x="865.0" y="280.0" text-anchor="middle" font-size="14" fill="#1b4d1f">存取權杖 2 小時</text><text x="865.0" y="299.0" text-anchor="middle" font-size="14" fill="#1b4d1f">刷新憑證 12 小時</text>
<path d="M 865,175 L 865,230" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="450" y="300" width="250" height="80" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="575.0" y="326.0" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">前端存入 localStorage</text><text x="575.0" y="345.0" text-anchor="middle" font-size="14" fill="#0d3c75">之後每個 API 請求帶</text><text x="575.0" y="364.0" text-anchor="middle" font-size="14" fill="#0d3c75">Authorization: Bearer</text>
<path d="M 760,290 L 700,330" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="330,360.0 425.0,400 330,440.0 235.0,400" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="330" y="405.0" text-anchor="middle" font-size="13" fill="#7a2e00">API 回 401 ?</text>
<path d="M 450,360 L 400,380" fill="none" stroke="#455a64" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="30" y="340" width="220" height="90" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="140.0" y="371.0" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">POST /api/v1/auth/refresh</text><text x="140.0" y="390.0" text-anchor="middle" font-size="14" fill="#7a2e00">以刷新憑證換發新權杖</text><text x="140.0" y="409.0" text-anchor="middle" font-size="14" fill="#7a2e00">成功:重送原請求;失敗:回登入</text>
<path d="M 255,400 L 250,395" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="241.5" y="382.5" width="22" height="17" fill="#ffffff" opacity="0.9"/>
<text x="252.5" y="394.5" text-anchor="middle" font-size="12" fill="#455a64">是</text>
<rect x="450" y="420" width="520" height="120" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/>
<text x="710.0" y="447.0" text-anchor="middle" font-size="14" fill="#263238" font-weight="700">後端授權:預設拒絕</text><text x="710.0" y="466.0" text-anchor="middle" font-size="14" fill="#263238">設定寫入(系統設定)與使用者維護需管理權限;</text><text x="710.0" y="485.0" text-anchor="middle" font-size="14" fill="#263238">文件頁:OPERATOR 只看操作手冊,其餘角色全看;</text><text x="710.0" y="504.0" text-anchor="middle" font-size="14" fill="#263238">ERP 金鑰只能用推單端點</text><text x="710.0" y="523.0" text-anchor="middle" font-size="14" fill="#263238">完整權限矩陣見 docs/spec20260905-s5-v1.md</text>
<text x="30" y="465.5" text-anchor="start" font-size="12" fill="#c62828">限制:權杖無狀態,登出後最長仍有 2 小時有效</text><text x="30" y="484.5" text-anchor="start" font-size="12" fill="#c62828">(Backlog B1)</text></svg>