<text x="100" y="265.0" text-anchor="middle" font-size="13" fill="#7a2e00">本筆數量 &gt; 0 ?</text>
<path d="M 100,190 L 100,220" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="89.0" y="190.0" width="22" height="17" fill="#ffffff" opacity="0.9"/>
<text x="100.0" y="202.0" text-anchor="middle" font-size="12" fill="#455a64">是</text>
