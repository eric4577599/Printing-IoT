<text x="355.0" y="441.0" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">POST /api/production/</text><text x="355.0" y="460.0" text-anchor="middle" font-size="14" fill="#0d3c75">completions</text><text x="355.0" y="479.0" text-anchor="middle" font-size="14" fill="#0d3c75">(帶 clientRecordId 冪等鍵)</text>
