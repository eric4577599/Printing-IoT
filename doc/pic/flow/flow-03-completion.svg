<text x="505.0" y="711.0" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">重試用盡:留 pending,不阻擋現場</text><text x="505.0" y="730.0" text-anchor="middle" font-size="14" fill="#7f1d1d">之後由報表頁「本機舊實績回填」補送</text><text x="505.0" y="749.0" text-anchor="middle" font-size="14" fill="#7f1d1d">(S10 掃描 → 回填,可重跑)</text>
<path d="M 300,710 L 360,720" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 150,660 L 150,640 L 260,560 L 260,520" fill="none" stroke="#455a64" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="187.0" y="585.0" width="36" height="17" fill="#ffffff" opacity="0.9"/>
<text x="205.0" y="597.0" text-anchor="middle" font-size="12" fill="#455a64">重試</text>
<text x="690" y="686.0" text-anchor="start" font-size="12" fill="#37474f" font-weight="700">冪等是重試安全的前提:</text><text x="690" y="705.0" text-anchor="start" font-size="12" fill="#37474f">同一個 clientRecordId</text><text x="690" y="724.0" text-anchor="start" font-size="12" fill="#37474f">重送不會產生第二筆。</text></svg>