<text x="630.0" y="362.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">後端落地(單次存檔)</text><text x="630.0" y="381.5" text-anchor="middle" font-size="14" fill="#1b4d1f">1 驗證欄位,失敗 400 零寫入</text><text x="630.0" y="400.5" text-anchor="middle" font-size="14" fill="#1b4d1f">2 以冪等鍵去重(已存在回 200)</text><text x="630.0" y="419.5" text-anchor="middle" font-size="14" fill="#1b4d1f">3 重算不良總數、停機次數</text><text x="630.0" y="438.5" text-anchor="middle" font-size="14" fill="#1b4d1f">4 算工廠日(08:00 換日)</text><text x="630.0" y="457.5" text-anchor="middle" font-size="14" fill="#1b4d1f">5 OEE 四個率值</text>
<path d="M 450,455 L 520,420" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="780" y="330" width="190" height="70" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="875.0" y="351.0" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">有 orderId 時</text><text x="875.0" y="370.0" text-anchor="middle" font-size="14" fill="#1b4d1f">工單狀態 → Completed</text><text x="875.0" y="389.0" text-anchor="middle" font-size="14" fill="#1b4d1f">(失敗只記 log,實績照落)</text>
<path d="M 740,380 L 780,370" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="780" y="430" width="190" height="50" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="875.0" y="450.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">回傳 201 / 200</text><text x="875.0" y="469.5" text-anchor="middle" font-size="14" fill="#1b4d1f">+ 後端算的率值</text>
<path d="M 630,480 L 630,500 L 875,500 L 875,480" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<polygon points="355,555.0 450.0,600 355,645.0 260.0,600" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="355" y="605.0" text-anchor="middle" font-size="13" fill="#7a2e00">送成功了嗎 ?</text>
<path d="M 355,490 L 355,555" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="323.0" y="507.5" width="64" height="17" fill="#ffffff" opacity="0.9"/>
<text x="355.0" y="519.5" text-anchor="middle" font-size="12" fill="#455a64">送出結果</text>
<rect x="560" y="570" width="250" height="60" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="685.0" y="595.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">成功:本機紀錄改 synced</text><text x="685.0" y="614.5" text-anchor="middle" font-size="14" fill="#1b4d1f">以後端的工廠日與 OEE 覆寫</text>
<path d="M 450,600 L 560,600" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="494.0" y="585.0" width="22" height="17" fill="#ffffff" opacity="0.9"/>
<text x="505.0" y="597.0" text-anchor="middle" font-size="12" fill="#455a64">是</text>
<rect x="30" y="660" width="270" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="165.0" y="686.5" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">失敗:依狀態碼判斷是否重試</text><text x="165.0" y="705.5" text-anchor="middle" font-size="14" fill="#7a2e00">斷網 / 429 / 408 / 5xx / 401 → 重試</text><text x="165.0" y="724.5" text-anchor="middle" font-size="14" fill="#7a2e00">400 / 403 / 409 → 不重試</text><text x="165.0" y="743.5" text-anchor="middle" font-size="14" fill="#7a2e00">階梯 2 秒 → 8 秒 → 30 秒</text>
<path d="M 300,625 L 200,660" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
