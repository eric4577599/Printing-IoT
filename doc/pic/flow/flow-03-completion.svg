<text x="325.0" y="255.5" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">提示「生產數量 0」</text><text x="325.0" y="274.5" text-anchor="middle" font-size="14" fill="#7f1d1d">改用 F10 退回</text>
<path d="M 175,260 L 230,260" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="191.5" y="245.0" width="22" height="17" fill="#ffffff" opacity="0.9"/>
<text x="202.5" y="257.0" text-anchor="middle" font-size="12" fill="#455a64">否</text>
<rect x="25" y="330" width="150" height="60" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="100.0" y="346.0" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">完工視窗</text><text x="100.0" y="365.0" text-anchor="middle" font-size="14" fill="#0d3c75">填良品、不良明細</text><text x="100.0" y="384.0" text-anchor="middle" font-size="14" fill="#0d3c75">短缺原因</text>
<path d="M 100,300 L 100,330" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
