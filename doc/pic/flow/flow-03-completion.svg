<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif" role="img" aria-label="完工(F4)到實績落地的流程"><title>完工(F4)到實績落地的流程</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#455a64"/></marker></defs><rect width="1000" height="690" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#1a237e">完工(F4)到實績落地的流程</text><rect x="40" y="50" width="120" height="34" rx="17.0" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="100.0" y="72.0" text-anchor="middle" font-size="13" fill="#0d3c75" font-weight="700">按 F4 完工</text>
<polygon points="100,110.0 175.0,150 100,190.0 25.0,150" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="100" y="155.0" text-anchor="middle" font-size="13" fill="#7a2e00">車速 = 0 ?</text>
