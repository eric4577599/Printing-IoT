<text x="100.0" y="441.0" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">前端組成績</text><text x="100.0" y="460.0" text-anchor="middle" font-size="14" fill="#0d3c75">寫本機快取</text><text x="100.0" y="479.0" text-anchor="middle" font-size="14" fill="#0d3c75">syncState = pending</text>
<path d="M 100,390 L 100,420" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="82.0" y="390.0" width="36" height="17" fill="#ffffff" opacity="0.9"/>
