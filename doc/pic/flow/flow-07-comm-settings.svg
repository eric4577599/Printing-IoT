<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei','Heiti TC',sans-serif" role="img" aria-label="通訊設定頁的結構與去向"><title>通訊設定頁的結構與去向</title><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#455a64"/></marker></defs><rect width="1000" height="520" fill="#ffffff"/><text x="20" y="28" font-size="17" font-weight="700" fill="#1a237e">通訊設定頁的結構與去向</text><rect x="30" y="60" width="270" height="90" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="165.0" y="100.5" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">設定頁 → 通訊設定</text><text x="165.0" y="119.5" text-anchor="middle" font-size="14" fill="#0d3c75">(儲存需系統設定權限)</text>
<rect x="30" y="190" width="270" height="150" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="165.0" y="222.5" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">PLC / 設備區塊</text><text x="165.0" y="241.5" text-anchor="middle" font-size="14" fill="#7a2e00">啟用開關(僅記錄)  模擬訊號</text><text x="165.0" y="260.5" text-anchor="middle" font-size="14" fill="#7a2e00">裝置類型:</text><text x="165.0" y="279.5" text-anchor="middle" font-size="14" fill="#7a2e00">  Advantech MQTT (WISE-4000)</text><text x="165.0" y="298.5" text-anchor="middle" font-size="14" fill="#7a2e00">  Generic Modbus TCP</text><text x="165.0" y="317.5" text-anchor="middle" font-size="14" fill="#7a2e00">  Mitsubishi Evol (MHI) · RS-232</text>
<rect x="30" y="370" width="270" height="120" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="165.0" y="397.0" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">ERP 區塊</text><text x="165.0" y="416.0" text-anchor="middle" font-size="14" fill="#0d3c75">啟用開關(僅記錄)</text><text x="165.0" y="435.0" text-anchor="middle" font-size="14" fill="#0d3c75">協定:LMC Flexo / Custom JSON·XML</text><text x="165.0" y="454.0" text-anchor="middle" font-size="14" fill="#0d3c75">連線方式:無 / TCP/IP / 檔案共享</text><text x="165.0" y="473.0" text-anchor="middle" font-size="14" fill="#0d3c75">主機、埠、輸入/輸出路徑</text>
<path d="M 300,230 L 360,225" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 300,290 L 360,310" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="360" y="190" width="280" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="500.0" y="211.0" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">依裝置類型出現的欄位</text><text x="500.0" y="230.0" text-anchor="middle" font-size="14" fill="#7a2e00">WISE:Broker、Topic、監控頻率</text><text x="500.0" y="249.0" text-anchor="middle" font-size="14" fill="#7a2e00">Modbus:IP、埠</text>
<rect x="360" y="275" width="280" height="70" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
<text x="500.0" y="296.0" text-anchor="middle" font-size="14" fill="#7a2e00" font-weight="700">Evol:序列埠裝置、速率</text><text x="500.0" y="315.0" text-anchor="middle" font-size="14" fill="#7a2e00">資料位元、同位、停止位元</text><text x="500.0" y="334.0" text-anchor="middle" font-size="14" fill="#7a2e00">(預設 9600 / 8 / 偶 / 1)</text>
<rect x="360" y="380" width="280" height="100" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="1.6"/>
<text x="500.0" y="416.0" text-anchor="middle" font-size="14" fill="#263238" font-weight="700">其他欄位</text><text x="500.0" y="435.0" text-anchor="middle" font-size="14" fill="#263238">定時寫入間隔、機台識別碼、MM 網址</text><text x="500.0" y="454.0" text-anchor="middle" font-size="14" fill="#263238">(整包存檔,少送欄位就被刪)</text>
<rect x="700" y="100" width="270" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
<text x="835.0" y="131.5" text-anchor="middle" font-size="14" fill="#1b4d1f" font-weight="700">PUT /api/settings/communication</text><text x="835.0" y="150.5" text-anchor="middle" font-size="14" fill="#1b4d1f">buildCommPayload 一律送全部欄位</text><text x="835.0" y="169.5" text-anchor="middle" font-size="14" fill="#1b4d1f">後端整包覆寫 Redis</text><text x="835.0" y="188.5" text-anchor="middle" font-size="14" fill="#1b4d1f">鍵:config/communication</text>
<path d="M 300,105 L 700,135" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="482.0" y="105.0" width="36" height="17" fill="#ffffff" opacity="0.9"/>
<text x="500.0" y="117.0" text-anchor="middle" font-size="12" fill="#455a64">儲存</text>
<rect x="700" y="260" width="270" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
<text x="835.0" y="292.0" text-anchor="middle" font-size="14" fill="#0d3c75" font-weight="700">Worker 實際會讀的設定</text><text x="835.0" y="311.0" text-anchor="middle" font-size="14" fill="#0d3c75">mqtt_topic(訂閱哪個 Topic)</text><text x="835.0" y="330.0" text-anchor="middle" font-size="14" fill="#0d3c75">plc_count_signal / plc_motor_signal</text><text x="835.0" y="349.0" text-anchor="middle" font-size="14" fill="#0d3c75">data_log_interval(寫歷史間隔)</text><text x="835.0" y="368.0" text-anchor="middle" font-size="14" fill="#0d3c75">其餘欄位目前只是記錄</text>
<path d="M 835,210 L 835,260" fill="none" stroke="#455a64" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="803.0" y="220.0" width="64" height="17" fill="#ffffff" opacity="0.9"/>
<text x="835.0" y="232.0" text-anchor="middle" font-size="12" fill="#455a64">週期重讀</text>
<rect x="700" y="420" width="270" height="90" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="1.6"/>
<text x="835.0" y="441.5" text-anchor="middle" font-size="14" fill="#7f1d1d" font-weight="700">尚未連動(只存設定值)</text><text x="835.0" y="460.5" text-anchor="middle" font-size="14" fill="#7f1d1d">plc_enabled / erp_enabled 開關</text><text x="835.0" y="479.5" text-anchor="middle" font-size="14" fill="#7f1d1d">Mitsubishi Evol 與 RS-232</text><text x="835.0" y="498.5" text-anchor="middle" font-size="14" fill="#7f1d1d">需另行實作 Worker 驅動</text>
<text x="30" y="510.0" text-anchor="start" font-size="12" fill="#546e7a">重點:新增欄位只要改 commPayload.js 一處(原本四處手寫,各漏不同欄位)。</text></svg>