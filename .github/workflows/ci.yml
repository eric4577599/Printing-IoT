name: Printing IoT CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build-and-test:
    name: Backend (.NET 8) Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x # Target .NET 9 since tests are net9.0
        
    - name: Clean macOS Resource Forks
      run: find backend -name "._*" -delete
        
    - name: Restore dependencies
      run: dotnet restore backend/PrintingIoT.sln
      
    - name: Build
      run: dotnet build backend/PrintingIoT.sln --no-restore --configuration Release
      
    - name: Test
      run: dotnet test backend/PrintingIoT.sln --no-build --configuration Release --verbosity normal

  frontend-build-and-test:
    name: Frontend (React 19 + Vite) Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Clean macOS Resource Forks
      run: find . -name "._*" -delete
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Unit Tests (Vitest)
      run: npx vitest run
      
    - name: Build
      run: npm run build
