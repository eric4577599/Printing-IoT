  f.innerHTML=h;
  f.querySelectorAll(".chip").forEach(btn=>btn.addEventListener("click",()=>{
    const t=btn.dataset.t,v=btn.dataset.v,set=active[t];
    if(set.has(v)){set.delete(v);btn.setAttribute("aria-pressed","false");}
    else{set.add(v);btn.setAttribute("aria-pressed","true");}
    apply();
  }));
})();

/* cards */
const setText=(el,t)=>{el.textContent=t;return el;};
function card(f){
  const c=document.createElement("article");
  c.className="card";c.dataset.sev=f.severity;c.dataset.area=f.area;
  const row=document.createElement("div");row.className="crow";
  row.innerHTML=`<span class="led" aria-hidden="true"></span>`
    +`<span class="idx">${String(f.idx).padStart(2,"0")}</span>`
    +`<span class="sev-tag">${f.severity}</span>`
    +`<span class="meta-chip">${f.area}</span>`
    +`<span class="meta-chip">${f.category}</span>`
    +`<span class="spacer"></span>`
    +`<span class="loc">${f.base}<span class="ln">:${f.line}</span></span>`
    +`<span class="votes"><span class="ok">${f.confirms}✓</span> / ${f.refutes}✗</span>`;
  c.appendChild(row);
  const t=document.createElement("h3");t.className="title";setText(t,f.title);c.appendChild(t);
  const im=document.createElement("div");im.className="impact";
  const ik=document.createElement("span");ik.className="k";ik.textContent="影響";
  const iv=document.createElement("span");setText(iv,f.impact);
  im.append(ik,iv);c.appendChild(im);
  const det=document.createElement("details");
  const sm=document.createElement("summary");sm.innerHTML='<span class="arrow">›</span> 說明 · 重現路徑';
  det.appendChild(sm);
  const body=document.createElement("div");body.className="detail-body";
  [["位置",f.file+":"+f.line,true],["根因",f.description,false],["重現",f.repro,false]].forEach(([k,v,mono])=>{
    const fd=document.createElement("div");fd.className="field";
    const kk=document.createElement("div");kk.className="k";kk.textContent=k;
    const vv=document.createElement("div");vv.className="v";
    if(mono){const cd=document.createElement("span");cd.className="code";cd.textContent=v;vv.appendChild(cd);}
    else setText(vv,v);
    fd.append(kk,vv);body.appendChild(fd);
  });
  det.appendChild(body);c.appendChild(det);
  return c;
}
const list=document.getElementById("list");
DATA.confirmed.forEach(f=>list.appendChild(card(f)));

    const rl2=document.createElement("span");rl2.className="rl";rl2.textContent=r.area+" · "+r.base+":"+r.line;
    el.append(x,rt,rl2);rl.appendChild(el);
  });
})();

/* filter apply */
function apply(){
  let shown=0;
  document.querySelectorAll(".card").forEach(c=>{
    const ok=active.sev.has(c.dataset.sev)&&active.area.has(c.dataset.area);
    c.classList.toggle("hidden",!ok);if(ok)shown++;
  });
  document.getElementById("shown").textContent="顯示 "+shown+" / "+DATA.confirmedCount;
}
apply();
